name: Cloudflare Migration Check

on:
  push:
    branches:
      - feat/cloudflare-migration
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Cloudflare typecheck
        run: npx tsc --noEmit -p tsconfig.cloudflare.json
      - name: Build
        run: npm run build
