# Cloudflare migration branch trigger verification
name: Cloudflare Migration Check

on:
  push:
    branches:
      - feat/cloudflare-migration
      - fix/fase1-bling-foundation
      - fix/fase2-bling-gateway
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Cloudflare typecheck
        run: npx tsc --noEmit -p tsconfig.cloudflare.json
      - name: Build
        run: npm run build
      - name: Verify Bling gateway boundary
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RIn --include='*.ts' 'https://api\.bling\.com\.br/Api/v3' api src/server || true)"
          unexpected="$(printf '%s\n' "$matches" | grep -vE '^(api/bling/callback\.ts|src/server/bling-client\.ts|src/server/bling-gateway\.ts):' || true)"
          if [ -n "$unexpected" ]; then
            echo "Encontradas chamadas diretas à API do Bling fora da fronteira autorizada:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
